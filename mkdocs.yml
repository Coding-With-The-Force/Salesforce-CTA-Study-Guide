site_name: Salesforce CTA Study Guide
site_description: The Complete Guide to the Salesforce Certified Technical Architect (CTA) exam.
site_author: Matt Gerry
site_url: https://coding-with-the-force.github.io/Salesforce-CTA-Study-Guide/

repo_name: Coding-With-The-Force/Salesforce-CTA-Study-Guide
repo_url: https://github.com/Coding-With-The-Force/Salesforce-CTA-Study-Guide

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    # Dark mode (default)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    # Light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Coding-With-The-Force/Salesforce-Separation-Of-Concerns-And-The-Apex-Common-Library
      name: View on GitHub
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@CodingWithTheForce
      name: YouTube Channel

copyright: "Made with 🦖 by <a href='https://github.com/Coding-With-The-Force'>Coding With The Force</a> &nbsp;|&nbsp; <a href='https://www.paypal.com/donate?business=RNHEF8ZWKKLDG&currency_code=USD'>Buy me some Taco Bell? 🌮</a>"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md

  - Exam Overview:
